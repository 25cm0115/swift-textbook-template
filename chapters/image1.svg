<svg viewBox="0 0 1250 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A9A9E"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C1440E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1250" height="400" fill="#FFFFFF"/>
  <text x="625" y="42" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="26" font-weight="700" fill="#1D1D1F">画像処理の流れ</text>
  <text x="625" y="66" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="14" fill="#6E6E73">第3章 applyFilter() の中身</text>
  <rect x="25" y="110" width="210" height="180" rx="18" fill="#FFF4EE" stroke="#FA7343" stroke-width="2.5"/>
  <text x="130" y="180" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="24" font-weight="700" fill="#C1440E">UIImage</text>
  <text x="130" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="14" fill="#4A4A4F">元の写真</text>
  <text x="130" y="236" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="11" fill="#8A8A8E">originalUIImage</text>
  <line x1="238" y1="200" x2="325" y2="200" stroke="#9A9A9E" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <circle cx="281.5" cy="168" r="14" fill="#FFFFFF" stroke="#9A9A9E" stroke-width="1.5"/>
  <text x="281.5" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6E6E73">1</text>
  <text x="281.5" y="222" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="11" fill="#6E6E73">CIImage(image:)</text>
  <rect x="330" y="110" width="250" height="180" rx="18" fill="#FFFBF5" stroke="#D98A57" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="455" y="180" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="24" font-weight="700" fill="#B8622B">CIImage</text>
  <text x="455" y="212" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="14" fill="#4A4A4F">フィルターの設計図</text>
  <text x="455" y="232" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="12" fill="#8A8A8E">（ピクセルはまだ無い）</text>
  <line x1="583" y1="200" x2="672" y2="200" stroke="#C1440E" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <circle cx="627.5" cy="168" r="14" fill="#FFFFFF" stroke="#C1440E" stroke-width="1.5"/>
  <text x="627.5" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#C1440E">2</text>
  <text x="627.5" y="220" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="10.5" fill="#C1440E">filter.apply(...)</text>
  <text x="627.5" y="235" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="10.5" fill="#C1440E">createCGImage(...)</text>
  <rect x="675" y="110" width="230" height="180" rx="18" fill="#EEF5FA" stroke="#2C5F8A" stroke-width="2.5"/>
  <text x="790" y="180" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="24" font-weight="700" fill="#1F4E79">CGImage</text>
  <text x="790" y="212" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="14" fill="#4A4A4F">計算されたピクセル</text>
  <text x="790" y="232" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="12" fill="#8A8A8E">（実際の画像データ）</text>
  <line x1="908" y1="200" x2="997" y2="200" stroke="#9A9A9E" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <circle cx="952.5" cy="168" r="14" fill="#FFFFFF" stroke="#9A9A9E" stroke-width="1.5"/>
  <text x="952.5" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6E6E73">3</text>
  <text x="952.5" y="222" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="11" fill="#6E6E73">UIImage(cgImage:)</text>
  <rect x="1000" y="110" width="210" height="180" rx="18" fill="#FFF4EE" stroke="#FA7343" stroke-width="2.5"/>
  <text x="1105" y="180" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="24" font-weight="700" fill="#C1440E">UIImage</text>
  <text x="1105" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="14" fill="#4A4A4F">画面に表示</text>
  <text x="1105" y="236" text-anchor="middle" font-family="'SF Mono','Menlo',Consolas,monospace" font-size="11" fill="#8A8A8E">displayImage</text>
  <text x="625" y="350" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',system-ui,sans-serif" font-size="15" font-style="italic" fill="#4A4A4F">同じ「画像」でも、段階によって役割が全部違う</text>
</svg>
